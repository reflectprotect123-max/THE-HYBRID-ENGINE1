# =============================================================================
# THE Conditioning System — the branded athlete site
# =============================================================================
#
# This directory exists for exactly one reason: Netlify reads ONE netlify.toml
# per site, the one at that site's BASE DIRECTORY. The repository root already
# has one and it builds the coach workspace. A second site that wants a
# different publish directory therefore needs a different base, and this is it
# — an otherwise empty folder whose only content is this file.
#
# Set the site's base directory to `deploy/conditioning` and everything below
# applies. The coach site keeps the root config and is untouched by any of it.
#
# WHAT THIS SITE IS
#
# The athlete app, built as the branded conditioning product
# (`VITE_HYBRID_PRODUCT=conditioning`). On that build `navTabs` yields
# Home / Cond / Library / Progress / Settings — no Train tab — `CoachAccess`
# sends `/coach` back to `/`, and `ManifestLink` offers the athlete manifest
# rather than the coach one. Strength is not surfaced anywhere, which is the
# owner's instruction, enforced by the product scope rather than by a route
# list here.
#
# The conditioning LAB is folded in at `/lab` by scripts/build-lab.mjs, so this
# is one address for the app and the bench.
#
# THE RELATIVE PATHS ARE THE FRAGILE PART, AND THEY ARE DELIBERATE
#
# `publish` and `functions` are resolved relative to the base directory, so
# both climb back to the repository root. That is the price of the one-toml-
# per-base rule above. If a deploy reports a missing publish directory or zero
# functions, this is the first thing to check — and the fix is these two paths,
# never a copy of the built output into this folder.
#
# FUNCTIONS ARE SHARED WITH THE COACH SITE ON PURPOSE
#
# `netlify/functions` holds the WHOOP and Concept2 OAuth surface. Both sites
# deploy the same source; each gets its own instance under its own origin.
# That is what makes WHOOP work here at all — the client half (WhoopProvider,
# the connect/sync UI, the recovery reading that feeds `conPrescription`) ships
# with the app, and does nothing until these answer.
#
# REQUIRED ENVIRONMENT VARIABLES — set on THIS site, not inherited:
#
#   APP_BASE_URL            this site's own origin. The OAuth callbacks build
#                           their return URL from it, so the coach site's value
#                           would hand an athlete to the wrong origin.
#   APP_SESSION_SECRET      signs the OAuth session cookie.
#   WHOOP_CLIENT_ID         from the WHOOP developer portal.
#   WHOOP_CLIENT_SECRET
#   CONCEPT2_CLIENT_ID      from Concept2's developer portal.
#   CONCEPT2_CLIENT_SECRET
#   SUPABASE_URL            the native connect path verifies a Supabase user
#   SUPABASE_JWT_SECRET     before it will attribute tokens to anyone.
#
# AND ONE THING THAT IS NOT A NETLIFY SETTING: this origin's callback URL must
# be registered with WHOOP and with Concept2
# (`https://<this-site>/.netlify/functions/whoop-callback`, and the Concept2
# equivalent). A provider rejects a redirect URI it has never seen, so without
# that registration Connect fails at their end and nothing in this repository
# can report a useful reason.

[build]
  base = "deploy/conditioning"
  publish = "../../apps/web/dist-conditioning"
  command = "cd ../.. && corepack enable && pnpm install --frozen-lockfile && pnpm run build:conditioning-site"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "../../netlify/functions"
  node_bundler = "esbuild"
