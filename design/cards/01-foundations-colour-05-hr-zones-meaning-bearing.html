<!-- @dsCard group="Foundations — Colour" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HR zones — meaning-bearing</title>
<style>
/* ============================================================================
   THE HYBRID SYSTEM — DESIGN KIT
   Every component from both apps (athlete phone PWA + coach desktop site) on
   ONE token set. Self-contained: no external fonts, scripts or images.

   HOW TO USE
   1. Restyle freely — the whole system is driven by the :root block below.
      Change tokens to retheme; change component rules to restructure.
   2. Coach components are shown on the DARK tokens on purpose: the agreed
      direction is one shared language with the coach site moving out of light.
   3. Send it back and both real apps get rewired to match. Token NAMES are the
      contract — keep them and the rewire is near-automatic.
   ========================================================================== */
:root{
  /* ---- SURFACES: page sits BELOW cards so cards float ---- */
  --bg:#070706; --panel:#141311; --panel2:#1c1b18; --panel3:#0a0a09;
  --well:#0c0c0a;
  --well-inset:inset 0 2px 4px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.03);
  --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.12);
  /* ---- TEXT ---- */
  --text:#f5f1e9; --muted:#aaa49a; --dim:#847d73;
  /* ---- ACCENT (the big unification call: gold, or the coach's orange?) ---- */
  --gold:#c09358; --gold2:#e0bc87; --gold-wash:rgba(192,147,88,.09);
  --gold-line:rgba(224,188,135,.22);
  --brass-grad:linear-gradient(180deg,rgba(224,188,135,.16),rgba(192,147,88,.05));
  --brass-edge:inset 0 1px 0 rgba(255,255,255,.14),0 1px 0 rgba(0,0,0,.35);
  --on-accent:#17120c;
  /* ---- STATE: completion is warm brass, never green ---- */
  --done-bg:rgba(192,147,88,.14); --done-line:rgba(224,188,135,.5); --done-ink:#e6c795;
  /* ---- SEMANTIC ---- */
  --ok:#9fc59b; --warn:#d1a464; --bad:#cf7f7c; --blue:#82a8e9;
  /* ---- HR ZONES: these carry MEANING. Change deliberately. ---- */
  --zone-blue:#5b8def; --zone-green:#33c07a; --zone-red:#e0524d; --z-mod:#cf9d4f;
  --neon-strain:#33C4FF; --neon-ok:#3DFF9E; --neon-warn:#FFC24D; --neon-bad:#FF5B57;
  --ring-idle:rgba(255,255,255,.14); --track:rgba(255,255,255,.08);
  /* ---- ELEVATION ---- */
  --shadow-card:0 12px 34px rgba(0,0,0,.22),inset 0 1px rgba(255,255,255,.018);
  --lift-open:0 18px 40px rgba(0,0,0,.5),0 0 0 1px rgba(224,188,135,.22),inset 0 1px 0 rgba(255,255,255,.05);
  /* ---- RADIUS ---- */
  --r-sm:10px; --r-md:14px; --r-lg:18px; --r-pill:999px;
  /* ---- TYPE ---- */
  --ff:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --fs-1:10px; --fs-2:11px; --fs-3:12px; --fs-4:13px; --fs-5:14px; --fs-6:16px; --fs-7:20px; --fs-8:26px;
  --fw-reg:500; --fw-med:650; --fw-semi:750; --fw-bold:800; --fw-black:900;
  /* ---- SPACE (4px rhythm) ---- */
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px; --sp-6:24px; --sp-8:32px;
  /* ---- MOTION ---- */
  --dur-fast:.12s; --dur-base:.15s; --dur-mid:.22s;
  --ease-standard:cubic-bezier(.22,.8,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:radial-gradient(circle at 50% -18%,var(--gold-wash),transparent 34rem),var(--bg);
  color:var(--text);font-family:var(--ff);-webkit-font-smoothing:antialiased;padding:var(--sp-8) var(--sp-6) 80px}
.wrap{max-width:1180px;margin:0 auto}

/* ---- kit chrome (not part of the product; strip on rewire) ---- */
.kit-h1{font-size:34px;font-weight:var(--fw-black);letter-spacing:-.02em}
.kit-lede{color:var(--muted);font-size:var(--fs-5);margin-top:var(--sp-2);max-width:70ch;line-height:1.6}
.kit-sec{margin-top:var(--sp-8);padding-top:var(--sp-6);border-top:1px solid var(--line)}
.kit-sec>h2{font-size:var(--fs-7);font-weight:var(--fw-bold);letter-spacing:-.01em}
.kit-sec>p{color:var(--dim);font-size:var(--fs-4);margin-top:var(--sp-1)}
.kit-grid{display:grid;gap:var(--sp-4);margin-top:var(--sp-5);
  grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.kit-item{min-width:0}
.kit-lab{font-size:var(--fs-1);font-weight:var(--fw-bold);letter-spacing:.14em;
  text-transform:uppercase;color:var(--dim);margin-bottom:var(--sp-2)}
.kit-row{display:flex;gap:var(--sp-2);flex-wrap:wrap;align-items:center}
.kit-phone{max-width:400px;border:1px solid var(--line);border-radius:var(--r-lg);
  padding:var(--sp-4);background:var(--panel3)}

/* ============================ FOUNDATIONS ============================ */
.sw{border-radius:var(--r-sm);height:64px;border:1px solid var(--line);display:flex;
  align-items:flex-end;padding:var(--sp-2);font-size:9px;color:var(--muted);font-weight:var(--fw-bold)}
.type-row{display:flex;align-items:baseline;gap:var(--sp-4);padding:var(--sp-2) 0;border-bottom:1px solid var(--line)}
.type-row span{color:var(--dim);font-size:var(--fs-2);width:64px;flex:0 0 auto}
.rad{height:56px;background:var(--panel2);border:1px solid var(--line2);display:grid;
  place-items:center;font-size:var(--fs-2);color:var(--muted)}

/* ============================ ATHLETE APP ============================ */
.kicker{font-size:var(--fs-1);font-weight:var(--fw-bold);letter-spacing:.18em;
  text-transform:uppercase;color:var(--gold)}
.screentitle{font-size:clamp(22px,4.2vw,28px);font-weight:var(--fw-black);letter-spacing:-.02em;margin-top:var(--sp-1)}
.sub{color:var(--muted);font-size:var(--fs-4);margin-top:var(--sp-1)}

.card{background:linear-gradient(165deg,var(--panel),var(--panel3));border:1px solid var(--line);
  border-radius:var(--r-lg);padding:var(--sp-4);box-shadow:var(--shadow-card)}
.sessioncard{position:relative;overflow:hidden}
.sessioncard::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(circle at 100% 0,var(--gold-wash),transparent 60%)}
.sc-kicker{font-size:var(--fs-1);font-weight:var(--fw-bold);letter-spacing:.16em;
  text-transform:uppercase;color:var(--gold)}
.sessioncard h3{font-size:var(--fs-7);font-weight:var(--fw-bold);margin-top:var(--sp-1);letter-spacing:-.01em}
.sc-meta{color:var(--muted);font-size:var(--fs-3);margin-top:var(--sp-1)}
.sc-chips{display:flex;gap:var(--sp-2);margin-top:var(--sp-3);flex-wrap:wrap}

.chip{font-size:var(--fs-1);font-weight:var(--fw-bold);letter-spacing:.1em;text-transform:uppercase;
  padding:5px 9px;border-radius:var(--r-pill);border:1px solid var(--line2);color:var(--muted)}
.chip.gold{background:var(--gold-wash);border-color:var(--gold-line);color:var(--gold2)}
.chip.cond{background:rgba(51,192,122,.1);border-color:rgba(51,192,122,.3);color:var(--zone-green)}

.bigbtn{width:100%;min-height:56px;border:none;border-radius:var(--r-md);cursor:pointer;
  background:linear-gradient(180deg,var(--gold2),var(--gold));color:var(--on-accent);
  font:inherit;font-size:var(--fs-6);font-weight:var(--fw-bold);letter-spacing:.01em;
  box-shadow:var(--brass-edge);transition:transform var(--dur-fast) var(--ease-standard)}
.bigbtn:active{transform:scale(.985)}
.addbtn{min-height:48px;padding:0 var(--sp-4);border-radius:var(--r-md);cursor:pointer;font:inherit;
  background:transparent;border:1px dashed var(--line2);color:var(--muted);
  font-size:var(--fs-4);font-weight:var(--fw-semi)}
.addbtn:hover{border-color:var(--gold-line);color:var(--gold2)}
.markall{background:none;border:none;color:var(--gold2);font:inherit;font-size:var(--fs-3);
  font-weight:var(--fw-semi);cursor:pointer}
.fab{width:56px;height:56px;border-radius:50%;border:none;cursor:pointer;display:grid;place-items:center;
  background:linear-gradient(180deg,var(--gold2),var(--gold));color:var(--on-accent);
  box-shadow:0 10px 26px rgba(0,0,0,.45),var(--brass-edge)}
.fab svg{width:24px;height:24px;stroke:currentColor;stroke-width:2.2;fill:none}

/* nav — bottom tab bar (phone) */
.navbar{display:flex;background:linear-gradient(180deg,rgba(20,20,19,.96),rgba(10,10,9,.98));
  border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--sp-1);gap:2px}
.navlink{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:10px 4px;border:0;border-radius:var(--r-sm);background:transparent;color:var(--muted);
  font:inherit;font-size:var(--fs-1);font-weight:var(--fw-med);cursor:pointer;
  transition:background var(--dur-base) var(--ease-standard),color var(--dur-base) var(--ease-standard)}
.navlink svg{width:20px;height:20px;stroke:currentColor;stroke-width:1.8;fill:none}
.navlink.active{background:linear-gradient(180deg,var(--gold-wash),transparent);color:var(--gold2)}
.navlink.active::before{content:"";position:absolute;top:0;left:22%;right:22%;height:2px;
  border-radius:var(--r-pill);background:linear-gradient(90deg,transparent,var(--gold2),transparent)}

/* week strip */
.week{display:flex;gap:6px}
.wd{flex:1;text-align:center;padding:var(--sp-2) 0;border-radius:var(--r-sm);border:1px solid var(--line);
  background:var(--panel3);cursor:pointer}
.wd span{display:block;font-size:9px;color:var(--dim);font-weight:var(--fw-bold);letter-spacing:.1em}
.wd b{display:block;font-size:var(--fs-5);margin-top:2px;font-variant-numeric:tabular-nums}
.wd.today{border-color:var(--gold-line);background:var(--gold-wash);color:var(--gold2)}
.wd.has::after{content:"";display:block;width:4px;height:4px;border-radius:50%;
  background:var(--gold);margin:4px auto 0}

/* logger accordion — the app's densest component */
.lgsec{font-size:var(--fs-1);font-weight:var(--fw-bold);letter-spacing:.18em;text-transform:uppercase;
  color:var(--dim);margin:var(--sp-4) 0 var(--sp-2);display:flex;gap:var(--sp-2);align-items:center}
.lgss{padding:3px 7px;border-radius:var(--r-pill);background:var(--gold-wash);
  border:1px solid var(--gold-line);color:var(--gold2);letter-spacing:.08em}
.lgx{background:linear-gradient(165deg,var(--panel),var(--panel3));border:1px solid var(--line);
  border-radius:var(--r-md);overflow:hidden;margin-bottom:var(--sp-2)}
.lgx.open{box-shadow:var(--lift-open);border-color:transparent;position:relative}
.lgx.open::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,var(--gold),var(--gold2),transparent)}
.lgcrow{display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-3) var(--sp-4);cursor:pointer}
.lgltr{width:34px;height:34px;border-radius:var(--r-sm);display:grid;place-items:center;flex:0 0 auto;
  background:var(--brass-grad);box-shadow:var(--brass-edge);color:var(--gold2);
  font-weight:var(--fw-black);font-size:var(--fs-4)}
.lgcn{flex:1;min-width:0}
.lgcn b{display:block;font-size:var(--fs-6);font-weight:var(--fw-bold)}
.lgcn span{display:block;color:var(--dim);font-size:var(--fs-3);margin-top:2px}
.lgstat{color:var(--muted);font-size:var(--fs-3);font-variant-numeric:tabular-nums}
.lghead,.lgrow{display:grid;grid-template-columns:28px 1fr 1fr 52px 40px;gap:var(--sp-2);
  align-items:center;padding:var(--sp-2) var(--sp-4)}
.lghead{border-top:1px solid var(--line)}
.lgth{font-size:9px;font-weight:var(--fw-bold);letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.lgno{color:var(--dim);font-size:var(--fs-3);font-weight:var(--fw-bold);font-variant-numeric:tabular-nums}
.lgtick{background:var(--well);box-shadow:var(--well-inset);border:1px solid var(--line);
  border-radius:var(--r-sm);padding:9px 10px;color:var(--text);font:inherit;font-size:var(--fs-5);
  font-weight:var(--fw-semi);width:100%;font-variant-numeric:tabular-nums;text-align:center}
.lgdone{width:32px;height:32px;border-radius:var(--r-sm);border:1px solid var(--line2);
  background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--dim)}
.lgdone.on{background:var(--done-bg);border-color:var(--done-line);color:var(--done-ink)}
.lgdone svg{width:16px;height:16px;stroke:currentColor;stroke-width:2.6;fill:none}

/* rings / gauges / stats */
.ringx{width:104px;height:104px;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(var(--neon-ok) 0 72%,var(--track) 72% 100%)}
.ringx-in{width:78px;height:78px;border-radius:50%;background:var(--panel);display:grid;place-items:center;
  border:1px solid var(--line)}
.ringx-in b{font-size:var(--fs-7);font-weight:var(--fw-black);font-variant-numeric:tabular-nums}
.ringx-in span{font-size:9px;color:var(--dim);letter-spacing:.1em;text-transform:uppercase}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--sp-2)}
.stat{background:var(--panel3);border:1px solid var(--line);border-radius:var(--r-md);padding:var(--sp-3);text-align:center}
.stat b{display:block;font-size:var(--fs-7);font-weight:var(--fw-black);font-variant-numeric:tabular-nums}
.stat span{display:block;color:var(--dim);font-size:var(--fs-2);margin-top:2px}
.zrow{display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-2) 0}
.zdot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
.znm{width:96px;font-size:var(--fs-3);color:var(--muted)}
.zbar{flex:1;height:8px;border-radius:var(--r-pill);background:var(--track);overflow:hidden}
.zfill{height:100%;border-radius:var(--r-pill)}
.zrng{font-size:var(--fs-2);color:var(--dim);font-variant-numeric:tabular-nums}

/* sheet + toast + empty + skeleton */
.sheet{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);
  border-radius:20px 20px 0 0;padding:var(--sp-4) var(--sp-4) var(--sp-6)}
.grab{width:38px;height:4px;border-radius:var(--r-pill);background:var(--line2);margin:0 auto var(--sp-4)}
.sheet h3{font-size:var(--fs-6);font-weight:var(--fw-bold)}
.ssub{color:var(--dim);font-size:var(--fs-3);margin-top:2px;margin-bottom:var(--sp-3)}
.bigopt{width:100%;display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-3);
  border:1px solid var(--line);border-radius:var(--r-md);background:var(--panel3);
  color:var(--text);font:inherit;text-align:left;cursor:pointer;margin-bottom:var(--sp-2)}
.bigopt .oi{width:36px;height:36px;border-radius:var(--r-sm);display:grid;place-items:center;
  background:var(--brass-grad);box-shadow:var(--brass-edge);flex:0 0 auto}
.bigopt b{display:block;font-size:var(--fs-5);font-weight:var(--fw-semi)}
.bigopt span{display:block;color:var(--dim);font-size:var(--fs-3)}
.cancel{width:100%;padding:var(--sp-3);border:none;background:none;color:var(--muted);
  font:inherit;font-size:var(--fs-5);font-weight:var(--fw-semi);cursor:pointer}
.toast{display:inline-block;background:var(--panel2);border:1px solid var(--line2);
  border-radius:var(--r-md);padding:11px 18px;font-size:var(--fs-4);font-weight:var(--fw-semi);
  box-shadow:var(--shadow-card)}
.empty{text-align:center;padding:var(--sp-8) var(--sp-4)}
.ei{width:52px;height:52px;border-radius:var(--r-md);margin:0 auto var(--sp-3);display:grid;
  place-items:center;background:var(--brass-grad);box-shadow:var(--brass-edge);color:var(--gold2)}
.empty b{display:block;font-size:var(--fs-6);font-weight:var(--fw-bold)}
.empty span{display:block;color:var(--dim);font-size:var(--fs-4);margin-top:var(--sp-1)}
.skel{height:12px;border-radius:var(--r-pill);margin-bottom:var(--sp-2);
  background:linear-gradient(90deg,var(--panel2),var(--panel3),var(--panel2))}

/* ====================== COACH (shown on dark tokens) ====================== */
.c-topbar{display:flex;align-items:center;gap:var(--sp-3);height:52px;padding:0 var(--sp-3);
  background:var(--panel3);border:1px solid var(--line);border-radius:var(--r-md)}
.c-progsel{display:flex;align-items:center;gap:9px;padding:6px 10px;border-radius:var(--r-sm);
  background:none;border:none;font:inherit;color:var(--text);cursor:pointer}
.c-std{width:26px;height:26px;border-radius:6px;background:var(--panel2);display:grid;place-items:center;
  font-size:8.5px;font-weight:var(--fw-bold);color:var(--muted);flex:0 0 auto}
.c-progsel b{font-size:var(--fs-5);font-weight:var(--fw-semi)}
.c-syncpill{margin-left:auto;display:flex;align-items:center;gap:7px;padding:6px 11px;
  border-radius:var(--r-pill);background:var(--panel2);color:var(--muted);font-size:var(--fs-3);
  font-weight:var(--fw-med);border:1px solid var(--line)}
.c-syncpill .dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.c-rail{width:80px;background:var(--panel3);border:1px solid var(--line);border-radius:var(--r-md);
  padding:var(--sp-3) 0;display:flex;flex-direction:column;align-items:center;gap:var(--sp-1)}
.c-logo{width:40px;height:40px;display:grid;place-items:center;color:var(--gold2);
  font-family:Georgia,serif;font-weight:var(--fw-black);font-size:22px;margin-bottom:var(--sp-2)}
.c-railbtn{width:64px;padding:9px 4px;border:none;background:none;color:var(--dim);cursor:pointer;
  border-radius:var(--r-sm);display:flex;flex-direction:column;align-items:center;gap:5px;
  font:inherit;font-size:9.5px;font-weight:var(--fw-med);position:relative}
.c-railbtn svg{width:20px;height:20px;stroke:currentColor;stroke-width:1.7;fill:none}
.c-railbtn.on{color:var(--gold2)}
.c-railbtn.on::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;
  border-radius:0 3px 3px 0;background:var(--gold)}
.c-days{display:flex;gap:7px}
.c-day{width:34px;height:34px;border-radius:50%;border:1px solid var(--line2);background:var(--panel3);
  color:var(--muted);font:inherit;font-size:var(--fs-4);font-weight:var(--fw-semi);cursor:pointer;
  display:grid;place-items:center;position:relative;font-variant-numeric:tabular-nums}
.c-day.on{background:var(--gold-wash);border-color:var(--gold-line);color:var(--gold2)}
.c-day.has::after{content:"";position:absolute;bottom:4px;left:50%;transform:translateX(-50%);
  width:4px;height:4px;border-radius:50%;background:var(--gold)}
.c-pvex{display:flex;gap:10px;padding:var(--sp-2) 0}
.c-mk{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line2);display:grid;
  place-items:center;font-size:var(--fs-2);font-weight:var(--fw-bold);flex:0 0 auto;color:var(--text)}
.c-pvex b{display:block;font-size:var(--fs-4);font-weight:var(--fw-med)}
.c-pvex span{display:block;font-size:var(--fs-3);color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}

.c-exc{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
.c-exhdr{display:flex;align-items:center;gap:var(--sp-3);background:var(--panel2);
  border-bottom:1px solid var(--line);padding:11px var(--sp-3)}
.c-exhdr .c-mk{width:30px;height:30px;font-size:var(--fs-4)}
.c-namewrap{flex:1;display:flex;align-items:center;gap:var(--sp-2);background:var(--panel3);
  border:1px solid var(--line2);border-radius:var(--r-sm);padding:7px 11px;cursor:pointer}
.c-namewrap b{flex:1;font-size:14.5px;font-weight:var(--fw-semi)}
.c-cv{color:var(--dim)}
/* superset chain-link between exercise letters */
.c-exlink{height:34px;display:flex;align-items:center;padding-left:15px;margin:-8px 0}
.c-chain{width:26px;height:26px;border-radius:50%;border:1.5px dashed var(--line2);
  background:var(--panel);color:var(--muted);display:grid;place-items:center;cursor:pointer;position:relative}
.c-chain::before,.c-chain::after{content:"";position:absolute;left:50%;transform:translateX(-50%);
  width:1.5px;height:10px;background:var(--line2)}
.c-chain::before{top:-10px}.c-chain::after{bottom:-10px}
.c-chain svg{width:14px;height:14px;stroke:currentColor;stroke-width:2;fill:none}
.c-chain.on{border-style:solid;border-color:var(--gold);background:var(--gold);color:var(--on-accent)}
/* prescription table */
.c-rxtbl{border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;background:var(--panel)}
.c-rxth{display:grid;grid-template-columns:38px 1fr 1fr;background:var(--panel2);border-bottom:1px solid var(--line)}
.c-rxth .c{padding:9px 10px;font-size:var(--fs-3);font-weight:var(--fw-semi);color:var(--muted);
  display:flex;align-items:center;gap:5px;border-left:1px solid var(--line)}
.c-rxth .c:first-child{border-left:none}
