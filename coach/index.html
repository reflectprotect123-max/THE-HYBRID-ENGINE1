<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>THE Hybrid System — Coach</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23141311'/><text x='50' y='72' font-size='64' font-family='Georgia,serif' font-weight='900' fill='%23c09358' text-anchor='middle'>H</text></svg>">
<style>
/* ============================================================
   COACH — the athlete app's Planner, laid out for a laptop.
   Tokens are the phone's own (:root in ../index.html) so what a
   coach authors looks like what the athlete runs. One top bar,
   one column of cards that open in place.
   ============================================================ */
@font-face{font-family:'Inter';src:url('../fonts/inter-var.woff2') format('woff2');font-weight:100 900;font-display:swap;font-style:normal}
:root{
  --bg:#070706; --panel:#141311; --panel2:#1c1b18; --panel3:#0a0a09;
  --well:#0c0c0a;
  --well-inset:inset 0 2px 4px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.03);
  --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.12);
  --text:#f5f1e9; --muted:#aaa49a; --dim:#847d73;
  --gold:#c09358; --gold2:#e0bc87; --gold-wash:rgba(192,147,88,.09);
  --gold-line:rgba(224,188,135,.22);
  --brass-grad:linear-gradient(180deg,rgba(224,188,135,.16),rgba(192,147,88,.05));
  --brass-edge:inset 0 1px 0 rgba(255,255,255,.14),0 1px 0 rgba(0,0,0,.35);
  --shadow-card:0 12px 34px rgba(0,0,0,.22),inset 0 1px rgba(255,255,255,.018);
  --lift-open:0 18px 40px rgba(0,0,0,.5),0 0 0 1px rgba(224,188,135,.22),inset 0 1px 0 rgba(255,255,255,.05);
  --ok:#9fc59b; --warn:#d1a464; --danger:#cf7f7c;
  --zone-blue:#5b8def; --zone-green:#33c07a; --zone-red:#e0524d;
  --r-sm:10px; --r-md:14px; --r-pill:999px;
  --ff:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--ff);background:var(--bg);color:var(--text);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
::-webkit-scrollbar{width:12px;height:12px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:8px;border:3px solid transparent;background-clip:padding-box}

/* ---------- one bar ---------- */
.topbar{height:60px;background:var(--panel3);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:0 20px;position:sticky;top:0;z-index:40}
.logo{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--gold);font-weight:900;font-size:19px;font-family:Georgia,'Times New Roman',serif;background:var(--panel);border:1px solid var(--line);flex:0 0 auto}
.progsel{display:flex;align-items:baseline;gap:9px;padding:5px 9px;border-radius:var(--r-sm);min-width:0}
.progsel:hover{background:var(--panel2)}
.progsel b{font-size:15px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:22vw}
.progsel .cg{color:var(--dim);font-size:11px}
.wksel{display:flex;align-items:baseline;gap:6px;padding:5px 9px;border-radius:var(--r-sm);color:var(--muted);font-size:12px;font-weight:650}
.wksel:hover{background:var(--panel2);color:var(--gold2)}
.views{display:flex;gap:2px}
.viewbtn{padding:6px 11px;border-radius:var(--r-pill);color:var(--dim);font-size:11px;font-weight:750;letter-spacing:.08em;text-transform:uppercase}
.viewbtn:hover{color:var(--muted)}
.viewbtn.on{color:var(--gold2);background:var(--gold-wash)}
.grow{flex:1}
.days{display:flex;gap:6px;align-items:center}
.day{width:32px;height:32px;border-radius:50%;border:1px solid var(--line2);background:var(--panel);color:var(--muted);font-size:12.5px;font-weight:750;display:grid;place-items:center;font-variant-numeric:tabular-nums;position:relative;flex:0 0 auto}
.day:hover{border-color:rgba(224,188,135,.4)}
.day.on{background:var(--brass-grad);box-shadow:var(--brass-edge);border-color:var(--gold-line);color:var(--gold2)}
.day.has::after{content:"";position:absolute;bottom:3px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--gold)}
.assignbtn{min-height:40px;padding:0 16px;border:1px solid #c99a5d;border-radius:var(--r-md);background:linear-gradient(180deg,#c89b62,#b4864d);color:#17120c;font-size:13.5px;font-weight:850;box-shadow:inset 0 1px rgba(255,255,255,.23),0 8px 20px rgba(110,72,26,.2);white-space:nowrap;display:inline-flex;align-items:center;gap:7px}
.assignbtn:hover{background:linear-gradient(180deg,#d0a66f,#bb8e52)}
.assignbtn svg{width:15px;height:15px;stroke:currentColor;stroke-width:1.9;fill:none}
.syncpill{display:flex;align-items:center;gap:7px;padding:5px 11px;border-radius:var(--r-pill);background:var(--panel2);border:1px solid var(--line);color:var(--muted);font-size:11.5px;font-weight:600;white-space:nowrap}
.syncpill .dot{width:7px;height:7px;border-radius:50%;background:var(--dim);flex:0 0 auto}
.syncpill.ok .dot{background:var(--ok)}
.syncpill.off .dot{background:var(--warn)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--brass-grad);box-shadow:var(--brass-edge);border:1px solid var(--gold-line);display:grid;place-items:center;color:var(--gold2);font-weight:800;font-size:12px;flex:0 0 auto}

/* ---------- one column ---------- */
.editor{padding:34px 20px 120px;overflow:auto}
.edcol{max-width:660px;margin:0 auto}
.kicker{font-size:10px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:rgba(224,188,135,.72)}
.ttl{display:block;width:100%;margin:4px 0 20px;padding:2px 6px;border:1px solid transparent;border-radius:8px;background:transparent;font:inherit;font-size:27px;font-weight:800;letter-spacing:-.03em;color:var(--text);outline:none}
.ttl:hover{border-color:var(--line2)}
.ttl:focus{border-color:var(--gold-line);background:var(--well);box-shadow:var(--well-inset)}
.ed-top{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.ed-top h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.03em}

.coachnote{border:1px solid var(--line);border-radius:var(--r-md);background:var(--panel);padding:12px 14px;margin-bottom:6px}
.coachnote label{display:block;font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-bottom:6px}
.coachnote textarea{width:100%;min-height:56px;resize:vertical;border:0;background:transparent;color:var(--text);font:inherit;font-size:13.5px;outline:none}
.coachnote textarea::placeholder{color:var(--dim)}

.sec{display:flex;align-items:baseline;gap:8px;margin:26px 0 0}
.sech{margin:0;padding:2px 6px;min-width:40px;max-width:340px;border:1px solid transparent;border-radius:6px;background:transparent;font:inherit;font-size:12.5px;font-weight:850;letter-spacing:.14em;text-transform:uppercase;color:var(--gold2);outline:none}
.sech:hover{border-color:var(--line2)}
.sech:focus{border-color:var(--gold-line);background:var(--well);box-shadow:var(--well-inset)}
.secm{width:74px;padding:2px 6px;border:1px solid transparent;border-radius:6px;background:transparent;font:inherit;font-size:11px;color:var(--dim);outline:none}
.secm:hover{border-color:var(--line2)}
.secm:focus{border-color:var(--gold-line);background:var(--well);color:var(--muted)}
.secm.ro{color:var(--dim);font-size:11px;padding:2px 6px}

/* the phone's card */
.lgx{position:relative;border:1px solid var(--line);border-radius:var(--r-md);background:var(--panel);margin-top:10px;box-shadow:var(--shadow-card);transition:border-color .15s ease}
.lgx:not(.open):hover{border-color:rgba(224,188,135,.3)}
.lgcrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:0 14px;min-height:60px}
.lgltr{flex:0 0 auto;min-width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:var(--r-sm);background:var(--brass-grad);box-shadow:var(--brass-edge);color:var(--gold2);font-size:12px;font-weight:850;border:1px solid var(--gold-line)}
.lgcn{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.lgcn b{font-size:16px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lgcn>span{font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lgcar{flex:0 0 auto;color:var(--dim);font-size:13px}
.lgx.open{border-color:transparent;box-shadow:var(--lift-open)}
.lgx.open::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:var(--r-md) var(--r-md) 0 0;z-index:2}
.lg-body{padding:2px 16px 18px;animation:reveal .26s cubic-bezier(.22,.9,.24,1)}
@keyframes reveal{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.namebtn{display:inline-flex;align-items:center;gap:7px;font:inherit;font-size:16px;font-weight:800;letter-spacing:-.01em;padding:0;color:var(--text);max-width:100%}
.namebtn .pen{color:var(--dim);font-size:12px;flex:0 0 auto}
.namebtn:hover,.namebtn:hover .pen{color:var(--gold2)}

.f{display:flex;align-items:center;gap:14px;margin-top:14px}
.f>label{flex:0 0 96px;font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#9a938a}
.step{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;background:var(--well);box-shadow:var(--well-inset)}
.step button{width:44px;min-height:44px;background:var(--panel2);color:var(--gold2);font-size:19px;font-weight:800}
.step button:hover{background:#242320}
.step .val{min-width:76px;display:grid;place-items:center;font-size:16px;font-weight:800;font-variant-numeric:tabular-nums;padding:0 10px}

/* typed set rows */
.setlist{display:flex;flex-direction:column;gap:8px;min-width:0}
.setrow{display:flex;align-items:center;gap:10px}
.setn{flex:0 0 52px;color:var(--dim);font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.sett,.setr{min-height:44px;padding:0 12px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--well);box-shadow:var(--well-inset);color:var(--text);font:inherit;font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;text-align:center;outline:none}
.sett{width:112px}
.setr{width:78px;font-size:15px;color:var(--gold2)}
.sett:focus,.setr:focus{border-color:var(--gold-line);box-shadow:var(--well-inset),0 0 0 3px rgba(192,147,88,.13)}
.sett::placeholder,.setr::placeholder{color:var(--dim);font-weight:600;font-size:13px}
/* a warm-up recedes so the working sets are what the eye lands on */
.setrow.warm .setn{color:var(--gold2);opacity:.75}
.setrow.warm .sett{color:var(--muted);border-style:dashed}
.setrow.warm .setr{opacity:.45}
.setx{width:30px;height:30px;border-radius:50%;color:var(--dim);font-size:12px;display:grid;place-items:center;flex:0 0 auto}
.setx:hover{color:var(--danger);background:rgba(207,127,124,.1)}
.setx.ghost{pointer-events:none}
.addset{align-self:flex-start;margin-top:2px;padding:9px 14px;border:1px dashed var(--line2);border-radius:var(--r-pill);color:var(--gold2);font-size:11px;font-weight:750;letter-spacing:.04em}
.addset:hover{border-color:rgba(224,188,135,.4)}
.setshint{margin:6px 0 0;color:var(--dim);font-size:11.5px;max-width:360px}
.setshint b{color:var(--muted);font-weight:750}

.cuefield{margin-top:16px}
.cuefield label{display:block;font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#9a938a;margin-bottom:6px}
.cuefield textarea{width:100%;min-height:46px;resize:vertical;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--well);box-shadow:var(--well-inset);padding:10px 12px;color:var(--text);font:inherit;font-size:13px;outline:none}
.cuefield textarea:focus{border-color:var(--gold-line)}
.cuefield textarea::placeholder{color:var(--dim)}

.cardctl{display:flex;gap:8px;margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.ctlbtn{width:42px;height:38px;border:1px solid var(--line2);border-radius:var(--r-sm);color:var(--muted);display:grid;place-items:center;font-size:14px}
.ctlbtn:hover{border-color:rgba(224,188,135,.4);color:var(--gold2)}
.ctlbtn.del{margin-left:auto;color:var(--danger);border-color:rgba(207,127,124,.3)}
.ctlbtn.del:hover{border-color:var(--danger)}

.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:7px 12px;border:1px solid var(--line2);border-radius:var(--r-pill);color:var(--muted);font-size:10px;font-weight:750;letter-spacing:.06em;text-transform:uppercase}
.chip:hover{border-color:rgba(224,188,135,.4)}
.chip.on{border-color:rgba(198,154,97,.42);background:var(--gold-wash);color:var(--gold2)}
.chip i{display:block;font-style:normal;font-size:9px;font-weight:600;letter-spacing:.04em;opacity:.6;margin-top:2px;text-align:center}
.chip.e-easy.on{border-color:var(--zone-blue);color:var(--zone-blue);background:transparent}
.chip.e-medium.on{border-color:var(--zone-green);color:var(--zone-green);background:transparent}
.chip.e-hard.on{border-color:var(--zone-red);color:var(--zone-red);background:transparent}

.planseam{display:flex;justify-content:center;padding:3px 0}
.planseam button{width:38px;height:28px;border-radius:var(--r-pill);border:1px solid var(--line);background:var(--panel2);color:var(--dim);display:grid;place-items:center;transition:.15s ease}
.planseam button:hover{border-color:rgba(224,188,135,.45);color:var(--gold2)}
.planseam button.on{color:var(--gold2);border-color:var(--gold-line);background:var(--gold-wash)}
.planseam svg{width:15px;height:15px;stroke:currentColor;stroke-width:1.8;fill:none}
.superwrap{margin-top:12px;padding-left:12px;border-left:3px solid var(--gold)}
.lgx.cond{border-color:rgba(51,192,122,.26)}
.lgx.cond .lgltr{color:var(--zone-green)}
.lgx.cond.open{border-color:transparent}

.addrow{display:flex;gap:10px;margin-top:18px}
.addbtn{flex:1;min-height:46px;border:1px dashed var(--line2);border-radius:var(--r-md);color:var(--gold2);font-size:13px;font-weight:750}
.addbtn:hover{border-color:rgba(224,188,135,.4)}

/* ---------- athletes ---------- */
.ath-wrap{display:grid;grid-template-columns:240px 1fr;gap:20px;margin-top:20px}
@media(max-width:900px){.ath-wrap{grid-template-columns:1fr}}
.ath-list{display:flex;flex-direction:column;gap:8px}
.ath-card{text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--panel)}
.ath-card.on{border-color:var(--gold-line);background:var(--gold-wash)}
.ath-card b{display:block;font-size:14px;font-weight:750}
.ath-card span{display:block;color:var(--dim);font-size:11.5px;margin-top:2px}
.ath-code,.ath-bigcode{display:inline-block;margin-top:6px;padding:3px 8px;border-radius:6px;background:var(--well);color:var(--gold2);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
.ath-bigcode{font-size:17px;padding:8px 14px}
.ath-detail{min-width:0}
.ath-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:800px){.ath-stats{grid-template-columns:repeat(2,1fr)}}
.ath-stat{border:1px solid var(--line);border-radius:var(--r-md);background:var(--panel);padding:12px 14px}
.ath-stat b{display:block;font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.ath-stat span{display:block;color:var(--dim);font-size:11px;margin-top:2px}
.ath-row{display:flex;gap:10px;align-items:baseline;padding:9px 0;border-top:1px solid var(--line)}
.ath-num{color:var(--muted);font-variant-numeric:tabular-nums;font-size:12.5px}
.ath-wh{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.ath-whd{border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:11.5px;color:var(--muted)}
.microlab{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-top:18px}
.microval{color:var(--muted);font-size:12.5px}
.c-field{border:1px solid var(--line);border-radius:var(--r-md);background:var(--panel);padding:14px 16px;color:var(--muted)}
.c-field p{margin:0}

/* ---------- menu / modal / toast ---------- */
#menu{position:fixed;inset:0;pointer-events:none;z-index:70}
#menu.on{pointer-events:auto}
.mmenu{position:fixed;background:var(--panel);border:1px solid var(--line2);border-radius:var(--r-md);box-shadow:0 24px 60px rgba(0,0,0,.55);padding:6px;max-height:60vh;overflow:auto;z-index:71}
.mmenu button{display:block;width:100%;text-align:left;padding:9px 12px;border-radius:8px;color:var(--text);font-size:13.5px}
.mmenu button:hover{background:var(--panel2);color:var(--gold2)}
.mmenu button.on{color:var(--gold2)}
.mmenu .sep{height:1px;background:var(--line);margin:5px 2px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.62);display:none;align-items:flex-start;justify-content:center;padding:11vh 20px;z-index:80}
#modal.on{display:flex}
.card{width:100%;max-width:440px;background:var(--panel);border:1px solid var(--line2);border-radius:var(--r-md);box-shadow:0 30px 70px rgba(0,0,0,.6);padding:20px}
.card h2{margin:0 0 4px;font-size:19px;font-weight:800;letter-spacing:-.02em}
.card .sub{margin:0 0 16px;color:var(--dim);font-size:12.5px}
.card label{display:block;margin:12px 0 5px;font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#9a938a}
.card input{width:100%;min-height:46px;padding:0 14px;border:1px solid var(--line2);border-radius:var(--r-sm);background:var(--well);box-shadow:var(--well-inset);color:var(--text);font:inherit;font-size:15px;outline:none}
.card input:focus{border-color:var(--gold-line)}
.card .row{display:flex;gap:10px;margin-top:16px}
.btn{flex:1;min-height:46px;border-radius:var(--r-md);font-size:14px;font-weight:800}
.btn.primary{border:1px solid #c99a5d;background:linear-gradient(180deg,#c89b62,#b4864d);color:#17120c}
.btn.ghost{border:1px solid var(--line2);color:var(--muted)}
.btn.ghost:hover{border-color:rgba(224,188,135,.4);color:var(--gold2)}
.card .x{position:absolute;top:14px;right:16px;color:var(--dim);font-size:20px}
.card .err{color:var(--danger);font-size:12.5px;margin-top:10px;min-height:1px}
.card .muted{color:var(--dim);font-size:11.5px;margin-top:14px;text-align:center}
.sheet .opts{margin-top:12px;max-height:280px;overflow:auto}
.sheet .opt{display:block;width:100%;text-align:left;padding:11px 12px;border-radius:var(--r-sm);color:var(--text);font-size:14px;font-weight:600}
.sheet .opt:hover{background:var(--panel2);color:var(--gold2)}
.sheet .opt small{display:block;color:var(--dim);font-size:11px;font-weight:500;margin-top:1px}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(10px);background:var(--panel2);border:1px solid var(--line2);border-radius:var(--r-pill);padding:11px 18px;color:var(--text);font-size:13px;font-weight:650;box-shadow:0 14px 34px rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:.2s ease;z-index:90}
#toast.on{opacity:1;transform:translateX(-50%)}

@media(prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
</style>
</head>
<body>

<header class="topbar">
  <div class="logo">H</div>
  <button class="progsel" data-act="progmenu"><b id="progname">Program</b><span class="cg">▾</span></button>
  <button class="wksel" data-act="wkmenu"><span id="wklabel">Week 1</span><span class="cg">▾</span></button>
  <div class="views" id="views">
    <button class="viewbtn on" data-view="library">Library</button>
    <button class="viewbtn" data-view="athletes">Athletes</button>
  </div>
  <div class="grow"></div>
  <div class="days" id="days"></div>
  <button class="assignbtn" data-act="assign"><svg viewBox="0 0 24 24"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4z"/></svg>Assign to phone</button>
  <span class="syncpill off" id="syncpill"><span class="dot"></span><span id="synclabel">Local only</span></span>
  <button class="avatar" id="avatar" data-act="account">·</button>
</header>

<main class="editor" id="editor"></main>

<div id="menu"></div>
<div id="modal"></div>
<div id="toast"></div>

<script src="../config.js"></script>
<script src="../vendor/supabase-2.110.7.js"></script>
