# =============================================================================
# The conditioning lab — its own Netlify site
# =============================================================================
#
# This file is only read when a Netlify site sets its BASE DIRECTORY to
# `apps/lab`. The repository root carries a different netlify.toml that builds
# and publishes the coach workspace, and Netlify reads exactly one — the one at
# the base directory. So the two sites deploy from the same repository and the
# same commit without either configuration touching the other.
#
# WHAT THIS DELIBERATELY DOES NOT HAVE, and why each absence is a decision:
#
#   * No `[functions]` block. The WHOOP and Concept2 functions live at the
#     repository root and belong to the athlete/coach product. The lab has no
#     account, no athlete and nothing to authenticate, so pointing it at them
#     would publish a second, unowned copy of an OAuth surface for no gain.
#   * No `_headers`, so no CSP is asserted here. The root site's CSP is checked
#     by `checks/pentest.mjs` because it serves real athlete data. This serves a
#     synthetic rig and stores nothing at all — there is no session to steal.
#   * No `_redirects`. Single page, no client-side router, no deep links.
#
# `pnpm install` is run from this directory on purpose: pnpm walks up to the
# workspace root, installs the whole workspace, and links `@hybrid/engine` —
# which is the point, because the lab reads the engine's real source rather
# than a vendored copy.

[build]
  base = "apps/lab"
  publish = "dist"
  command = "corepack enable && pnpm install --frozen-lockfile && pnpm run build"

[build.environment]
  NODE_VERSION = "22"
