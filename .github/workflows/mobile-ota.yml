name: Mobile — OTA update (EAS Update)

# AUTOMATIC. Runs on every push to main that touches the mobile app or a
# package it depends on, and publishes an EAS Update — no manual dispatch.
#
# This is the JS/asset half of "auto install". An update only reaches a phone
# whose installed build declares the SAME runtimeVersion, which app.json pins
# to a fixed string ("1") that a human bumps by hand.
#
# It used to use the "fingerprint" policy, and that silently broke delivery:
# fingerprint hashes the autolinked native module directories, and under pnpm
# those directory names embed the peer-resolution hash, so merely adding
# eas-cli to the workspace injected "graphql@16.8.1" into every expo-* path
# and changed the runtime version. Updates published green, and every phone
# ignored them — no error on either side. A fixed string cannot drift like
# that.
#
# The other half — any NATIVE change (new native module, permission, icon,
# SDK bump) — is still not deliverable here, and still needs mobile-eas.yml to
# produce a fresh APK. The rule that keeps that honest lives in app.json:
# bump runtimeVersion in the same commit as the native change. Skipping that
# bump is what would push a JS bundle onto a binary that cannot run it.
#
# Gated on EXPO_TOKEN exactly like mobile-eas.yml, and exits GREEN with an
# explanation when it is absent so a push does not paint the repo red before
# that secret exists. It does exist now, and this workflow has published real
# updates — but note that the gate makes a skip and a publish look identical
# from the run list. Confirm by whether the job ran `Publish EAS Update`, not
# by the green tick alone.
#
# Publishes to BOTH the "preview" and "production" channels. It used to
# publish only to "preview" (Jul 27–31), then only to "production" (this Jul
# 31 revision) — both were guesses at which channel the real installed app
# is on, and neither was confirmed against an actual device. eas.json's
# "production" profile builds an app-bundle with no internal-distribution
# link and this repo has no `eas submit` step anywhere, so a "production"
# build has no verified path onto a real phone at all; the only installable
# artifact (`distribution: internal`, an actual .apk) is the "preview"
# profile. Until someone confirms from the device itself which channel it is
# bound to, publish to both rather than guess again — the cost is one extra
# `eas update` call, not a repeat of two silent-no-op incidents in one day.

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "packages/engine/**"
      - "packages/design/**"
      - "packages/config/**"
      - "pnpm-lock.yaml"
  # Manual escape hatch — e.g. to re-publish after a workflow-only fix that
  # doesn't touch a path above, or to retry without an empty commit.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    name: eas update --channel preview,production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check for EXPO_TOKEN
        id: gate
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "${EXPO_TOKEN:-}" ]; then
            echo "have_token=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Skipped::No EXPO_TOKEN secret is set, so there is no Expo account to publish an update with. Skipping — this is not a failure."
          else
            echo "have_token=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.gate.outputs.have_token == 'true'

      - uses: actions/setup-node@v6
        if: steps.gate.outputs.have_token == 'true'
        with:
          node-version: 22

      - uses: pnpm/action-setup@v6
        if: steps.gate.outputs.have_token == 'true'
        with:
          cache: true

      - name: Install workspace
        if: steps.gate.outputs.have_token == 'true'
        run: pnpm install --frozen-lockfile

      # Cheap, fast gate before spending an EAS Update publish on something
      # broken. Not sufficient on its own (see mobile-eas.yml's README note on
      # tsc vs Metro) but `eas update` bundles with the same Metro/Hermes
      # pipeline, so a bundling failure surfaces there regardless.
      - name: Typecheck the mobile app
        if: steps.gate.outputs.have_token == 'true'
        run: pnpm --filter @hybrid/mobile typecheck

      - name: Publish EAS Update (preview)
        if: steps.gate.outputs.have_token == 'true'
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          # Passed through the environment, not interpolated into the script
          # text below — a commit message is arbitrary text (quotes,
          # newlines) and string-substituting it directly into a shell
          # command is exactly how that breaks: an embedded double-quote
          # closes the argument early and the rest gets parsed as separate
          # CLI args. Only the subject line, since EAS truncates past 1024
          # characters anyway and the subject is what a channel label needs.
          # head_commit is only set on a push event; a manual dispatch has no
          # commit to summarize.
          UPDATE_MESSAGE: ${{ github.event.head_commit.message || 'Manual OTA publish' }}
        run: |
          set -euo pipefail
          # `eas-cli` is a real devDependency here (not `pnpm dlx`), unlike
          # mobile-eas.yml's `eas build`. That distinction matters: `eas
          # build` only uploads and returns — `eas update` bundles LOCALLY,
          # forking Metro worker child processes that resolve babel presets
          # by walking up from the working directory. `pnpm dlx` runs the
          # tool from an isolated, ephemeral store, and those forked workers
          # didn't inherit a working directory that resolves this project's
          # own node_modules — "Cannot find module '@babel/plugin-transform-
          # react-jsx'" even with the plugin present in the pnpm store,
          # reproducible only inside dlx's isolation, not via a direct local
          # invocation. A properly linked local binary doesn't have that
          # problem. --platform android matches every other build script:
          # this app has no real iOS or web target.
          node_modules/.bin/eas update \
            --channel preview \
            --platform android \
            --message "$(head -n1 <<< "$UPDATE_MESSAGE")" \
            --non-interactive

      - name: Publish EAS Update (production)
        if: steps.gate.outputs.have_token == 'true'
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          UPDATE_MESSAGE: ${{ github.event.head_commit.message || 'Manual OTA publish' }}
        run: |
          set -euo pipefail
          node_modules/.bin/eas update \
            --channel production \
            --platform android \
            --message "$(head -n1 <<< "$UPDATE_MESSAGE")" \
            --non-interactive
