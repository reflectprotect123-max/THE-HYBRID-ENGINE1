name: CI

# One job that runs exactly what `pnpm run verify` runs locally, plus every
# other check that needs no network and no secrets.
#
# As of 16 August 2026 that was EVERY check under `checks/`, the two mobile
# parity gates included. THE PARITY GATES ARE DELETED as of 21 August 2026
# (repo split, Task 2): they proved the old strength logger, which was
# deleted on the 17th, and their restore condition — "Phase C ships the new
# logger" — belongs to reflectprotect123-max/strengthside now, where a
# reference copy of the harness/driver/fixture lives under
# docs/reference/parity-harness. A commented-out step whose restore condition
# can never be met in THIS repo is a decorative guard, so the step went with
# the harness (`apps/mobile/parity/`, `src/root.web.tsx`), the driver
# (`checks/parity/`), the three gate scripts and their package.json entries —
# all in the same commit.
#
# Four checks were added on 15 August 2026 —
# screens, pwa-update, mobile-touch and (already present) the contract loop —
# and TWO of them failed immediately on real defects that had been invisible
# for want of anyone running them. If a check exists and is not here, say why
# in a comment rather than leaving the gap silent. Each phase is its own step so a failure is
# legible in the Actions UI, but every step invokes the SAME package.json script
# a human would — CI and a laptop cannot drift apart without someone editing
# package.json.

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned so the browser cache key is exact and a Playwright release cannot
  # change what CI tested overnight. Playwright is deliberately NOT a workspace
  # dependency: checks/*.mjs import it optionally and skip cleanly without it,
  # which is what lets a contributor run them on a machine with no browser.
  # CI installs it explicitly so those sections actually execute — see the
  # "silently skipped" guard below.
  PLAYWRIGHT_VERSION: 1.61.1

jobs:
  verify:
    name: typecheck, test, build, smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      # Reads the pnpm version from package.json's `packageManager` field.
      # `cache: true` caches the pnpm store, keyed on pnpm-lock.yaml.
      - uses: pnpm/action-setup@v6
        with:
          cache: true

      - name: README map still resolves
        # Resolves every backticked path and symbol in README.md. It was RED on
        # main from 14 August 2026 to the 16th — the README named six deleted
        # packages and two deleted exports — and nobody saw it, because it is
        # CI's first step and `pnpm run verify` does not include it. So a green
        # local run said nothing about this one. If you add a check to verify,
        # ask whether it belongs there too.
        run: node checks/docs.mjs

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm run test

      # Static checks read migration TEXT and cannot see that a domain list is
      # written in three places — the constraint and both plpgsql RPC bodies.
      # A migration widening only the constraint applies cleanly, passes every
      # static assertion, then rejects every write at runtime. This applies the
      # migrations to a real throwaway Postgres and writes through the RPCs.
      # It skips itself when no local postgres is present.
      #
      # The SKIP path is guarded the way react-smoke's is: this check exits 0
      # when it finds no local postgres, so without the guard a runner image
      # that stopped shipping postgres would turn the one check that proves RLS
      # actually isolates two athletes into a silent no-op, and CI would stay
      # green having verified nothing.
      #
      # The pgvector install step and the KNOWN ENVIRONMENT GAP grep that sat
      # here were deleted on 21 August 2026 with the five strength migrations
      # they served (repo split, Task 2) — the only `create extension vector`
      # in this repo's migrations was phase_f's, which MOVED to
      # reflectprotect123-max/strengthside along with the gap machinery in
      # checks/migrations-apply.mjs.
      - name: Migrations apply to a real Postgres
        run: |
          set -o pipefail
          node checks/migrations-apply.mjs 2>&1 | tee "$RUNNER_TEMP/migrations-apply.log"
          if grep -qiE 'SKIP — no local postgres' "$RUNNER_TEMP/migrations-apply.log"; then
            echo "::error::migrations-apply found no postgres, so the RLS and RPC behaviour was never exercised."
            exit 1
          fi

      - name: Build both web apps
        run: pnpm run build

      # Netlify publishes ONE directory, and `netlify.toml` runs this same
      # script. It copies the coach app, icons, fonts, assetlinks, privacy.html
      # and _headers/_redirects into apps/web/dist, then FAILS if anything the
      # built HTML references is absent. Running it here means a missing asset
      # breaks a pull request rather than a deploy.
      - name: Assemble the publish directory
        run: node scripts/build-site.mjs

      # The deployed CSP (_headers) is `script-src 'self' 'wasm-unsafe-eval'`
      # with no 'unsafe-inline'. A single inline <script> in the built HTML —
      # a Vite modulepreload polyfill, a PWA registration snippet, a small
      # runtime chunk — is blocked by the browser and the app renders a blank
      # page in production while working perfectly in dev. That failure is
      # invisible to `vite build`, so it is asserted here.
      - name: No inline <script> in built HTML (CSP guarantee)
        run: pnpm run check:csp

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}

      - name: Install Playwright + Chromium
        run: |
          pnpm add -w -D playwright@"$PLAYWRIGHT_VERSION"
          pnpm exec playwright install --with-deps chromium

      # 26 checks: drives the BUILT output of apps/web and apps/coach in a real
      # browser. Requires the dists from the build step above.
      - name: React smoke (built output, Chromium)
        run: |
          set -o pipefail
          node checks/react-smoke.mjs 2>&1 | tee "$RUNNER_TEMP/react-smoke.log"
          if grep -qiE 'playwright not installed|no Chromium' "$RUNNER_TEMP/react-smoke.log"; then
            echo "::error::react-smoke skipped its browser section — Playwright was not usable, so nothing was actually tested."
            exit 1
          fi

      # Serves apps/web/dist the way Netlify will — real files ahead of any
      # rewrite, netlify.toml redirects before _redirects, _headers applied as
      # real response headers — and boots both apps in Chromium under the real
      # CSP. The cutover's failure modes are all silent: a missing icon still
      # renders, an uncopied _headers still serves the site with no CSP at all,
      # and /coach/ falling through to the athlete app reads as a routing quirk
      # rather than a missing product.
      - name: Deploy smoke (publish directory, Chromium)
        run: pnpm run smoke:deploy

      # Measures button heights under BOTH pointer emulations. The coarse-pointer
      # rule in tokens.css is the kind of media query that is easy to write and
      # easy to get wrong — it can match nothing, or match everything — and every
      # other browser suite runs with a fine pointer, so none of them would ever
      # enter the branch. This asserts fingers get 44px AND that a mouse still
      # gets the compact sizes.
      - name: Web touch targets (both pointer emulations)
        run: node checks/web-touch.mjs

      # Screenshots every /coach route at 1440px AND 420px and FAILS on
      # horizontal overflow. CLAUDE.md has claimed phone support for the whole
      # bench since 11 August; this is the only thing that can catch a
      # regression in it, and it ran nowhere until 15 August 2026.
      - name: Coach screens (both widths, no horizontal overflow)
        run: |
          set -o pipefail
          node checks/screens.mjs 2>&1 | tee "$RUNNER_TEMP/screens.log"
          if grep -qiE 'screenshots need a browser' "$RUNNER_TEMP/screens.log"; then
            echo "::error::screens.mjs found no browser, so no route was actually shot."
            exit 1
          fi

      # The mobile parity step that sat here (excluded 19 August 2026, deleted
      # 21 August 2026) is gone with the harness and gates it invoked — see
      # the workflow header for the full account and where the reference copy
      # lives.

      # The whole update loop: builds TWO real bundles, serves the second under
      # a page running the first, and asserts the new version is announced,
      # does NOT swap itself in unasked, and does swap when asked.
      #
      # It ran nowhere until 15 August 2026, and on the day it was wired in it
      # caught a live regression: deleting UpdateBanner with the athlete
      # surface left serviceWorker.ts publishing a waiting worker to nobody, so
      # no deploy would ever have reached an installed bench. That is the exact
      # defect this check was written for, reintroduced and then caught.
      #
      # It rewrites a source file and restores it in a `finally`. Last, so a
      # crash cannot leave a marker in the tree for another step to build.
      - name: PWA update loop (two real builds, Chromium)
        run: node checks/pwa-update.mjs

      # Reachability walks the import graph from each app's entry point. Dead
      # code with a passing test is the dangerous kind — the suite goes green
      # and nothing calls it, which is how "Foreground GPS tracking" got marked
      # done while the app never wired it up. Ratchet, same shape as the lane
      # contract: an allowlist entry that stops being true fails too.
      - name: Reachability (no unreachable source files)
        run: node checks/reachability.mjs

      # A CSS state class the app never applies. Added after a coach on a
      # phone tapped "+ Add exercise from library" and the block went EMPTY:
      # the picker mounted, the phone stylesheet hid it (`.cb-picker` is
      # display:none until `.picker-open`), and no code ever wrote that class.
      # Every other gate passed it — jsdom applies no stylesheet, the 420px
      # screenshot check fails on OVERFLOW and a hidden element has no width,
      # and desktop review never reaches the media query at all.
      - name: CSS state classes (nothing rendered is unreachable)
        run: node checks/css-state-classes.mjs

      # Suites that need no network and no secrets. emit-contract used to lead
      # this list; it string-pinned the vanilla app.js and round-tripped the
      # vanilla coach emit.js through a browser. Both are deleted, and
      # packages/engine/src/emit.test.ts already asserts every property it
      # pinned — against the live code rather than by regexing a file.
      #
      # pentest attacks the real function crypto in-process and then statically
      # sweeps all three apps for raw-HTML sinks,
      # whoop-deployment-smoke is pure file reads, whoop-contract constructs and
      # asserts OAuth URLs without calling anyone, and supabase-contract runs
      # its static half (it skips only the live round-trip, which needs
      # credentials).
      #
      # whoop-contract must run AFTER the build: its secret scan sweeps the
      # built bundles as well as the source, because a credential baked in at
      # build time exists nowhere in the tree.
      #
      # concept2-contract is whoop-contract's Concept2 Logbook twin: same
      # source-scan-plus-runtime-import shape, asserting Concept2's OWN
      # contract (log.concept2.com hosts, comma-delimited scopes, the
      # versioned Accept header) rather than reusing WHOOP's. It also asserts
      # two intentional absences — no webhook integration (sync is pull-based)
      # and no token-revocation call on disconnect (Concept2 offers no such
      # endpoint) — rather than demanding machinery that was never part of
      # this provider's contract.
      #
      # mobile-touch was NAMED in this comment and absent from the loop below
      # until 15 August 2026 — the documentation asserted a coverage that did
      # not exist, which is worse than an honest gap. Adding it immediately
      # failed: two raw <Pressable> had entered with the round-major logger
      # (RestTakeover and SessionLogger), both under the touch minimum and with
      # no press feedback. That is the whole argument for this step.
      #
      # mobile-touch and contrast guard two things a UI audit found and nothing
      # else can see: that every tappable in the phone app goes through <Tap>
      # (which is what makes touch targets reach 48dp and give feedback), and
      # that no ink/surface pair in the palette drops under 3:1. Both are
      # invisible to tsc, to Metro, and to a screenshot — which is exactly how
      # thirteen undersized controls accumulated one reasonable-looking line at
      # a time.
      #
      # supabase-auth mints tokens against a local fixture secret and attacks
      # the verifier with them. It is here rather than beside the unit tests
      # because a regression in it is not a failing feature — it is anyone who
      # copied the public anon key out of a client bundle being handed a
      # logged-in identity.
      #
      # The vanilla app that browser-smoke, torture, coach-smoke, native-pwa-smoke
      # and golden-vectors drove has been deleted, and so have they. Its coverage
      # did not vanish with it: react-smoke and deploy-smoke drive the BUILT
      # React output under the real headers, check:csp guards the inline-script
      # rule, and pentest's static sweep guards the injection sinks the vanilla
      # XSS suite existed to find.
      - name: Contract + security suites (no network)
        run: |
          set -o pipefail
          for check in pentest supabase-contract ecosystem-contract coach-contract whoop-contract concept2-contract whoop-deployment-smoke supabase-auth contrast mobile-touch; do
            echo "::group::checks/$check.mjs"
            node "checks/$check.mjs" 2>&1 | tee "$RUNNER_TEMP/$check.log"
            echo "::endgroup::"
            if grep -qiE 'playwright not installed|no Chromium' "$RUNNER_TEMP/$check.log"; then
              echo "::error::checks/$check.mjs skipped its browser section — Playwright was not usable."
              exit 1
            fi
          done
