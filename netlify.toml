# =============================================================================
# THE Hybrid System — deployment
# =============================================================================
#
# The site IS the React monorepo: apps/web (athlete PWA) is the origin, and
# is the only thing this deploy serves — the desktop coach builder that used
# to live at /coach/ has been removed; see git history if it needs reviving.
#
# Netlify publishes exactly ONE directory, so `scripts/build-site.mjs` assembles
# everything the origin must serve into apps/web/dist — the icons and fonts the
# built HTML already references, .well-known/assetlinks.json, privacy.html, and
# _headers/_redirects (which Netlify reads from the PUBLISH directory, not the
# repo root; miss that and the CSP silently disappears while the site keeps
# working, which is the worst possible failure mode).
#
# That script also FAILS the build if anything the built HTML references is
# absent, so a missing asset breaks the deploy rather than shipping a PWA with
# no icon.
#
# The one part of a rollback that is not instant: browsers that have already
# taken the Workbox worker at /sw.js keep it until they fetch an update. The
# build ships a tombstone at the OLD /service-worker.js path so existing
# installs hand over cleanly on the way IN; coming back relies on the normal
# service-worker update cycle.

# TWO SITES, ONE CONFIG (15 August 2026).
#
# This file is read by BOTH deployed sites — the coach workspace and the
# branded conditioning athlete app — and the site's own `HYBRID_SITE`
# environment variable decides which one gets built. Unset means coach, so the
# existing site's behaviour is byte-for-byte what it was before this comment
# appeared.
#
# The obvious alternative was a second netlify.toml under a subdirectory,
# selected by that site's base directory. That is Netlify's own documented
# monorepo pattern, it was implemented, and it could not be USED: the base
# directory picker refuses a folder that does not look like a project, and
# adding a package.json to make it look like one did not persuade it either.
#
# `publish` cannot branch — it is a static string here — so the branch lives in
# what gets written to it instead. `scripts/deploy-site.mjs` assembles either
# site into `apps/web/dist`, and fails loudly on an unrecognised HYBRID_SITE
# rather than defaulting, because a typo silently publishing the coach
# workspace to the athlete's domain is the worst outcome on offer.

[build]
  base = "."
  publish = "apps/web/dist"
  command = "corepack enable && pnpm install --frozen-lockfile && node scripts/deploy-site.mjs"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
